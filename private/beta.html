<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>server.bot beta</title>
<link rel="icon" href="/resource/bot.jpg">
<style>
:root{color-scheme:dark}
body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#e6e6e6}
header{display:flex;justify-content:space-between;align-items:center;padding:.75rem 1rem;border-bottom:1px solid #23262d}
main{max-width:720px;margin:0 auto;padding:1rem}
button,select,input[type=number]{font:inherit;padding:.5rem .9rem;border-radius:6px;border:1px solid #333845;background:#1a1d24;color:inherit}
button{cursor:pointer}button:disabled{opacity:.5;cursor:default}
select{max-width:100%}
.primary{background:#4f6bff;border-color:#4f6bff;color:#fff}
a{color:#7aa2ff;text-decoration:none}.muted{color:#8b93a5}.small{font-size:.85rem}
.card{border:1px solid #23262d;border-radius:8px;padding:.75rem 1rem;margin:.6rem 0}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.55rem 0}
.row label{display:flex;gap:.4rem;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.badge{font-size:.75rem;padding:.1rem .5rem;border-radius:99px;background:#23262d}
.on{background:#1d3b2a;color:#5ad17a}.off{background:#3b1d1d;color:#ff8080}
.ok{color:#5ad17a}.err{color:#ff7b7b}
h3{margin:1.4rem 0 .2rem}
.field{display:flex;flex-direction:column;gap:.2rem;min-width:9rem;flex:1}
.field span{font-size:.8rem;color:#8b93a5}
input[type=text],textarea{font:inherit;padding:.5rem .7rem;border-radius:6px;border:1px solid #333845;background:#1a1d24;color:inherit;width:100%;box-sizing:border-box}
textarea{min-height:4.5rem;resize:vertical}
.tag{font-family:monospace;color:#9db4ff}
.brand{display:flex;align-items:center;gap:.55rem}.brand img{width:30px;height:30px;border-radius:8px;object-fit:cover}
</style></head>
<body>
<header><span class="brand"><img src="/resource/bot.jpg" alt="" onerror="this.remove()"><b>server.bot</b><span class="badge">BETA</span></span><span id="who" class="muted"></span></header>
<main>
  <p id="msg" class="muted">Loading…</p>
  <p><a id="invite" href="#" target="_blank" rel="noopener"><button class="primary">Add bot to a server</button></a></p>
  <div id="login" hidden><a href="/auth/discord"><button class="primary">Login with Discord</button></a></div>
  <div id="app" hidden>
    <select id="guild"></select>
    <h3>Games</h3>
    <div id="games"></div>
    <h3>Triggers <span class="muted small" id="trigServer"></span></h3>
    <p class="muted small">Custom <code>!commands</code> for your home server. Beta: only you can see this page.</p>
    <div id="trigList"></div>
    <div class="card" id="trigForm"></div>
    <h3>Feeds</h3>
    <p class="muted small">Set feeds up in Discord with <code>/wotd</code>, <code>/dailyfact</code> and <code>/feeds</code>.</p>
    <div id="feeds"></div>
    <p><a href="/">Member page</a> · <a href="/auth/logout">Logout</a></p>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const NAMES = { wotd: 'Word of the Day', dailyfact: 'Daily Fact' };
const el = (t, p = {}, ...k) => { const e = Object.assign(document.createElement(t), p); k.forEach((x) => e.append(x)); return e; };
// Always resolves { ok, status, data } so callers can show the server's message.
async function call(method, url, body) {
  try {
    const r = await fetch(url, { method, headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    return { ok: r.ok, status: r.status, data: await r.json().catch(() => ({})) };
  } catch { return { ok: false, status: 0, data: { error: 'Network error. Check your connection.' } }; }
}
async function api(u) { const r = await call('GET', u); if (!r.ok) throw new Error(r.status); return r.data; }
const hours = (ms) => (ms % 864e5 === 0 ? `${ms / 864e5}d` : ms % 36e5 === 0 ? `${ms / 36e5}h` : `${Math.round(ms / 6e4)}m`);
let inviteUrl = '#';
let guilds = [];

// ---------------- feeds (read-only) ----------------
async function loadFeeds() {
  const box = $('#feeds'); box.replaceChildren();
  const r = await call('GET', `/api/guilds/${$('#guild').value}/feeds`);
  if (!r.ok) return box.append(el('p', { className: 'muted', textContent: 'Could not load feeds.' }));
  if (!r.data.length) return box.append(el('p', { className: 'muted', textContent: 'No feeds set up in this server yet.' }));
  r.data.forEach((f) => box.append(el('div', { className: 'card' },
    el('b', { textContent: NAMES[f.type] + (f.enabled ? '' : ' (disabled)') }),
    el('div', { className: 'muted', textContent: `Channel ${f.channelId} · every ${hours(f.intervalMs)} · ${f.emoji} · next ${new Date(f.nextRunAt).toLocaleString()}` }))));
}

// ---------------- games ----------------
const GAME_INFO = {
  countryguess: { title: 'Country Guess', blurb: 'Members play with !countryguess (or !cg) in this channel.' },
  wordstory: { title: 'Word Story', blurb: 'Members write a story one word at a time.', warn: 'Saving restarts the story and posts a setup message in the channel.' },
  wordchain: { title: 'Word Chain', blurb: 'Each word must start with the last letter of the previous one.', warn: 'Saving restarts the chain and posts a setup message in the channel.' },
};

function renderGame(guildId, key, cfg, channels, limits) {
  const info = GAME_INFO[key];
  const card = el('div', { className: 'card' });
  const badge = el('span', { className: 'badge ' + (cfg ? (cfg.enabled ? 'on' : 'off') : ''), textContent: cfg ? (cfg.enabled ? 'On' : 'Off') : 'Not set up' });
  const top = el('div', { className: 'top' }, el('b', { textContent: info.title }), badge);
  const result = el('div', { className: 'small' });
  const show = (ok, text) => { result.className = 'small ' + (ok ? 'ok' : 'err'); result.textContent = text; };

  const select = el('select');
  if (!cfg) select.append(el('option', { value: '', textContent: 'Create a channel for me (Activity category)' }));
  channels.forEach((c) => select.append(el('option', { value: c.id, textContent: `#${c.name}${c.parent ? ` (${c.parent})` : ''}` })));
  if (cfg) select.value = cfg.channelId;
  const channelRow = el('div', { className: 'row' }, el('span', { className: 'muted', textContent: 'Channel' }), select);

  const options = el('div');
  let trigger; let consecutive; let repeating;
  const checkbox = (label, checked) => { const i = el('input', { type: 'checkbox', checked: !!checked }); return [i, el('label', {}, i, label)]; };
  if (key === 'wordstory') {
    trigger = el('input', { type: 'number', min: limits.min, max: limits.max, value: cfg?.trigger ?? limits.default, style: 'width:6rem' });
    const [ci, cl] = checkbox('Allow the same person to write twice in a row', cfg?.consecutive); consecutive = ci;
    options.append(el('div', { className: 'row' }, el('label', {}, 'Words per story', trigger), el('span', { className: 'muted small', textContent: `(${limits.min}-${limits.max})` })), el('div', { className: 'row' }, cl));
  }
  if (key === 'wordchain') {
    const [ri, rl] = checkbox('Allow repeated words', cfg?.repeatingValid); repeating = ri;
    const [ci, cl] = checkbox('Allow the same person to write twice in a row', cfg?.consecutive); consecutive = ci;
    options.append(el('div', { className: 'row' }, rl), el('div', { className: 'row' }, cl));
  }

  const save = el('button', { className: 'primary', textContent: cfg ? 'Save' : 'Set up' });
  save.onclick = async () => {
    const body = { channelId: select.value || null };
    if (trigger) body.trigger = parseInt(trigger.value, 10);
    if (consecutive) body.consecutive = consecutive.checked;
    if (repeating) body.repeatingValid = repeating.checked;
    save.disabled = true; show(true, 'Saving…');
    const r = await call('PUT', `/api/guilds/${guildId}/games/${key}`, body);
    save.disabled = false;
    if (r.ok) { show(true, r.data.message || 'Saved.'); loadGames(); } else show(false, r.data.error || `Failed (${r.status}).`);
  };
  const actions = el('div', { className: 'row' }, save);
  if (cfg) {
    const toggle = el('button', { textContent: cfg.enabled ? 'Disable' : 'Enable' });
    toggle.onclick = async () => {
      toggle.disabled = true;
      const r = await call('POST', `/api/guilds/${guildId}/games/${key}/enabled`, { enabled: !cfg.enabled });
      if (r.ok) loadGames(); else { toggle.disabled = false; show(false, r.data.error || `Failed (${r.status}).`); }
    };
    actions.append(toggle);
  }
  card.append(top, el('div', { className: 'muted small', textContent: info.blurb }), channelRow, options, actions);
  if (info.warn) card.append(el('div', { className: 'muted small', textContent: info.warn }));
  card.append(result);
  return card;
}

let gamesToken = 0;
async function loadGames() {
  const box = $('#games');
  const g = guilds.find((x) => x.id === $('#guild').value);
  const note = (text, withInvite) => { box.replaceChildren(el('p', { className: 'muted', textContent: text })); if (withInvite) box.append(el('a', { href: inviteUrl, target: '_blank', rel: 'noopener' }, el('button', { className: 'primary', textContent: 'Add bot to this server' }))); };
  if (!g) return note('Pick a server.');
  if (!g.admin) return note('You need the Administrator permission in this server to change games.');
  if (g.botIn === false) return note('The bot is not in this server yet.', true);
  const token = ++gamesToken;
  const r = await call('GET', `/api/guilds/${g.id}/games`);
  if (token !== gamesToken) return; // the user switched servers meanwhile
  if (!r.ok) return r.data.error === 'not_in_guild' ? note('The bot is not in this server yet.', true) : note(r.data.error || 'Could not load games.');
  box.replaceChildren(...Object.keys(GAME_INFO).map((k) => renderGame(g.id, k, r.data.games[k], r.data.channels, r.data.limits.trigger)));
}


// ---------------- triggers (owner only, home server) ----------------
const secsToText = (ms) => (!ms ? '' : ms % 864e5 === 0 ? `${ms / 864e5}d` : ms % 36e5 === 0 ? `${ms / 36e5}h` : `${Math.round(ms / 6e4)}m`);
let trig = null; // { roles, actions, max, triggers }

function describe(t) {
  const a = trig.actions.find((x) => x.value === t.action);
  const role = trig.roles.find((r) => r.id === t.roleId);
  const action = a ? `${a.label} on ${t.applyTo === 'author' ? 'author' : 'target'}${role ? ` · @${role.name}` : ''}${t.action === 'mute' ? ` · ${secsToText(t.durationMs)}` : ''}` : `Response only${role ? ` · @${role.name}` : ''}`;
  const resp = t.respondType === 'message' ? `Message: ${(t.respond || '').slice(0, 80)}` : `Reaction ${t.respond || ''}`;
  return `${action}  |  ${resp}`;
}

function renderTriggerForm(edit) {
  const f = $('#trigForm'); f.replaceChildren();
  const e = edit || {};
  const field = (label, node) => el('label', { className: 'field' }, el('span', { textContent: label }), node);
  const name = el('input', { type: 'text', placeholder: 'hire', maxLength: 33, value: e.name || '', disabled: false });
  const action = el('select'); action.append(el('option', { value: '', textContent: 'None (response only)' }));
  trig.actions.forEach((a) => action.append(el('option', { value: a.value, textContent: a.label }))); action.value = e.action || '';
  const applyTo = el('select'); applyTo.append(el('option', { value: 'target', textContent: 'Target (first @mention)' }), el('option', { value: 'author', textContent: 'Author (who typed it)' })); applyTo.value = e.applyTo || 'target';
  const role = el('select'); role.append(el('option', { value: '', textContent: 'No role' }));
  trig.roles.forEach((r) => role.append(el('option', { value: r.id, textContent: `@${r.name}${r.editable ? '' : ' (bot cannot manage)'}` }))); role.value = e.roleId || '';
  const duration = el('input', { type: 'text', placeholder: '10m, 2h, 1d', value: e.action === 'mute' ? secsToText(e.durationMs) : '' });
  const rtype = el('select'); rtype.append(el('option', { value: 'reaction', textContent: 'Reaction (emoji)' }), el('option', { value: 'message', textContent: 'Message' })); rtype.value = e.respondType || 'reaction';
  const respond = el('textarea', { placeholder: 'Emoji, or text with ${authormention} ${authername} ${targetmention} ${targetname} ${rolename} ${rolemention}', value: e.respond || '' });
  const inReply = el('input', { type: 'checkbox', checked: e.inReply !== false });
  const delAfter = el('input', { type: 'number', min: 0, max: 60, value: e.deleteAfter ?? 0, style: 'width:5rem' });
  const delPrompt = el('input', { type: 'checkbox', checked: !!e.deletePrompt });
  const delPromptAfter = el('input', { type: 'number', min: 0, max: 60, value: e.deletePromptAfter ?? 0, style: 'width:5rem' });

  const rowRole = field('Role (for Role add / remove, and ${rolename})', role);
  const rowDur = field('Mute duration (1m - 28d)', duration);
  const rowReply = el('div', { className: 'row' }, el('label', {}, inReply, 'Reply to the prompt'));
  const rowPromptAfter = el('div', { className: 'row' }, el('label', {}, 'Seconds before the prompt is deleted (0 = right away)', delPromptAfter));
  const sync = () => { rowDur.hidden = action.value !== 'mute'; rowReply.hidden = rtype.value !== 'message'; rowPromptAfter.hidden = !delPrompt.checked; };
  [action, rtype, delPrompt].forEach((n) => { n.onchange = sync; });

  const result = el('div', { className: 'small' });
  const show = (ok, text) => { result.className = 'small ' + (ok ? 'ok' : 'err'); result.style.whiteSpace = 'pre-line'; result.textContent = text; };
  const save = el('button', { className: 'primary', textContent: edit ? 'Update trigger' : 'Create trigger' });
  save.onclick = async () => {
    const body = {
      command: name.value.trim(), action: action.value || null, applyTo: applyTo.value, roleId: role.value || null,
      duration: action.value === 'mute' ? duration.value.trim() || null : null,
      respondType: rtype.value, respond: respond.value.trim(),
      inReply: inReply.checked, deleteAfter: parseInt(delAfter.value, 10) || 0,
      deletePrompt: delPrompt.checked, deletePromptAfter: parseInt(delPromptAfter.value, 10) || 0,
    };
    save.disabled = true; show(true, 'Saving…');
    const r = await call('PUT', '/api/beta/triggers', body);
    save.disabled = false;
    if (r.ok) { await loadTriggers(r.data.message); } else show(false, r.data.error || `Failed (${r.status}).`);
  };
  const clear = el('button', { textContent: 'Clear', onclick: () => renderTriggerForm(null) });

  f.append(
    el('b', { textContent: edit ? `Editing !${edit.name}` : 'New trigger' }),
    el('div', { className: 'row' }, field('Command name (letters only)', name), field('Action', action), field('Apply to', applyTo)),
    el('div', { className: 'row' }, rowRole, rowDur),
    el('div', { className: 'row' }, field('Response type', rtype)),
    el('div', { className: 'row' }, field('Response', respond)),
    rowReply,
    el('div', { className: 'row' }, el('label', {}, 'Seconds before my response is removed (0 = keep)', delAfter)),
    el('div', { className: 'row' }, el('label', {}, delPrompt, 'Delete the message that ran the command')),
    rowPromptAfter,
    el('div', { className: 'row' }, save, clear),
    result,
  );
  sync();
  return show;
}

async function loadTriggers(notice) {
  const list = $('#trigList');
  const r = await call('GET', '/api/beta/triggers');
  if (!r.ok) { list.replaceChildren(el('p', { className: 'err small', textContent: r.data.error || 'Could not load triggers.' })); $('#trigForm').replaceChildren(); return; }
  trig = r.data;
  $('#trigServer').textContent = `· ${trig.guild.name} (${trig.triggers.length}/${trig.max})`;
  list.replaceChildren(...(trig.triggers.length ? trig.triggers.map((t) => {
    const del = el('button', { textContent: 'Delete' });
    del.onclick = async () => {
      if (!confirm(`Delete !${t.name}?`)) return;
      del.disabled = true;
      const d = await call('DELETE', `/api/beta/triggers/${encodeURIComponent(t.name)}`);
      if (d.ok) loadTriggers(d.data.message); else { del.disabled = false; alert(d.data.error || 'Failed.'); }
    };
    return el('div', { className: 'card' },
      el('div', { className: 'top' }, el('b', { className: 'tag', textContent: `!${t.name}` }), el('span', { className: 'row' }, el('button', { textContent: 'Edit', onclick: () => { renderTriggerForm(t); $('#trigForm').scrollIntoView({ behavior: 'smooth' }); } }), del)),
      el('div', { className: 'muted small', textContent: describe(t) }));
  }) : [el('p', { className: 'muted small', textContent: 'No triggers yet.' })]));
  const show = renderTriggerForm(null);
  if (notice) show(true, notice);
}

function loadGuild() { loadGames(); loadFeeds(); }


(async () => {
  try { inviteUrl = (await api('/api/invite')).url; $('#invite').href = inviteUrl; } catch {}
  try {
    guilds = await api('/api/guilds');
    $('#who').textContent = (await api('/api/me')).username;
    $('#msg').hidden = true; $('#app').hidden = false;
    loadTriggers();
    guilds.forEach((g) => $('#guild').append(el('option', { value: g.id, textContent: g.name })));
    $('#guild').onchange = loadGuild;
    if (guilds.length) loadGuild(); else { $('#games').textContent = 'No servers you manage.'; $('#feeds').textContent = ''; }
  } catch { $('#msg').hidden = true; $('#login').hidden = false; }
})();
</script></body></html>
